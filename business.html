<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QueueLess — Business Dashboard</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main>

        <section class="hero">

            <div class="hero-content">

                <p class="hero-label">
                    QUEUELESS BUSINESS
                </p>

                <h1>
                    Manage your
                    <span>queue.</span>
                </h1>

                <p class="hero-description">
                    View customers, manage your queue,
                    and keep things moving.
                </p>


                <div class="queue-card">

                    <div class="queue-card-header">

                        <span>
                            Business Dashboard
                        </span>

                        <span class="status">
                            ● Open
                        </span>

                    </div>


                    <div class="ticket">

                        <p>
                            Customers Waiting
                        </p>

                        <h2>
                            0
                        </h2>

                        <p>
                            Currently serving
                        </p>

                        <strong>
                            —
                        </strong>

                    </div>

                </div>


                <button class="primary-btn">
                    Serve Next Customer
                </button>

            </div>

        </section>

    </main>

</body>

</html>
