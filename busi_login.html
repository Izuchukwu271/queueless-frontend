<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QueueLess — Business Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main>

        <section class="hero">

            <div class="hero-content">

                <p class="hero-label">
                    QUEUELESS BUSINESS
                </p>

                <h1>
                    Welcome
                    <span>back.</span>
                </h1>

                <p class="hero-description">
                    Sign in to manage your business queue.
                </p>


                <div class="join-form">

                    <form id="businessLoginForm">

                        <div class="form-group">

                            <label for="phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                placeholder="e.g. 690111111"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="primary-btn form-submit-btn"
                        >
                            Login
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <script src="js/business-login.js"></script>

</body>

</html>
